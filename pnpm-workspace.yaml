shellEmulator: true
trustPolicy: no-downgrade

overrides:
  # Preserve the upstream patch, which targets this exact Partytown release.
  '@qwik.dev/partytown': 0.11.2
  # 4.0.3 lacks provenance while 4.0.1 is attested and API-compatible for
  # Astro's file watcher. Keep the supply-chain policy enabled.
  chokidar: 4.0.1

patchedDependencies:
  '@qwik.dev/partytown@0.11.2': patches/@qwik.dev__partytown@0.11.2.patch

allowBuilds:
  esbuild: true
  sharp: true
  simple-git-hooks: true
